name: Setup
description: Node, pnpm and dependencies
inputs:
  node:
    description: Node version
    default: '22'
runs:
  using: composite
  steps:
    - name: Setup pnpm and Node
      uses: pnpm/setup@v3
      with:
        runtime: node@${{ inputs.node }}
        cache: true

    - name: Install dependencies
      shell: bash
      run: pnpm ci
