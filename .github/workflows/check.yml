name: Check
on:
  push:
    branches:
      - main
      - dev
      - ci/cd
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install deps
        run: pnpm ci
      - name: Lint
        run: pnpm run lint
