name: CI
on:
  push:
    branches:
      - main
      - ci/cd

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm exec eslint

      - name: Prettier
        run: pnpm exec prettier --check "**/*.{js,ts,jsx,tsx,json,css,md}"

      - name: Generate Prisma types
        run: pnpm exec prisma generate

      - name: Generate Next types
        run: pnpm exec dotenv -e .env.test -- next typegen

      - name: TypeScript type check
        run: pnpm type

      - name: Prepare database
        run: pnpm test:db:prepare

      - name: Tests (dom and node)
        run: pnpm test:run

  test-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate Prisma types
        run: pnpm exec prisma generate

      - name: Build app
        run: pnpm exec dotenv -e .env.test next build

      - name: Prepare database
        run: pnpm test:db:prepare

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Tests (browser)
        run: pnpm exec dotenv -e .env.test -- playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report to GitHub Actions Artifacts
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [test-browser]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download blob reports from GitHub Actions Artifacts
        uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML Report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v5
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 7
